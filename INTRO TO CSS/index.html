<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css</title>
    <link rel="stylesheet" href="style.css">
    <style>
        h2{
            color: green;
        }
    </style>
</head>
<body>
    <!-- 3 methods of writing css -->
     <!-- inline ss -->
    <p style="color: red;">Welcome to css</p>
    <!-- internal css -->
     <h2>Hello Everyone</h2>
     <h4>This is my first class in CSS</h4>
    <!-- external css -->


    <!-- selector
     id
     element
     class -->
     <h3>Hello Girl</h3>
     <div class="css-class">
        <h2 class="css-class">The class is going well</h2>
        <h4>I am a girl</h4>
     </div>

     <div class="div"></div>
     <div class="page"></div>

     <div id="main">
        <h1>Hello there</h1>
        <p>I am enjoying my class</p>
     </div>

     
</body>
</html>
